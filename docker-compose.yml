version: '3.8'

services:
  # PostgreSQL 16 + PostGIS Spatial Database
  db:
    image: postgis/postgis:16-3.4
    container_name: smartinfra_postgis
    environment:
      POSTGRES_DB: smartinfra_pune
      POSTGRES_USER: smartinfra
      POSTGRES_PASSWORD: smartinfra_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartinfra -d smartinfra_pune"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SmartInfra AI FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartinfra_backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartinfra:smartinfra_secret_password@db:5432/smartinfra_pune
      APP_NAME: "SmartInfra AI"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "False"
      TIMEZONE: "Asia/Kolkata"
      SECRET_KEY: "prod_jwt_super_secret_key_change_in_production_environment"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      IMD_API_KEY: "${IMD_API_KEY:-}"
      WEATHER_PROVIDER: "openmeteo"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_database.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  postgis_data:
